# Local PostgreSQL for development. No external accounts required.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_local_only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./db/provision.sql:/docker-entrypoint-initdb.d/provision.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # TCP, not the socket: the init-time server (running provision.sql) listens
      # only on the socket, so this passes only once provisioning has finished.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  pgdata:
